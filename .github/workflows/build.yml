name: Build

# macOS installers can only be produced on macOS, so the .dmg is built here rather
# than on a developer machine. Run it from the Actions tab and download the artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
      - name: Confirm the app bundle is signed
        # An arm64 bundle with no signature at all is refused by the kernel, so this
        # is the difference between "warns on first open" and "will not start".
        run: codesign --verify --verbose=2 release/mac-arm64/Grabber.app
      - uses: actions/upload-artifact@v4
        with:
          name: grabber-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: grabber-windows-x64
          path: release/*.exe
          if-no-files-found: error
