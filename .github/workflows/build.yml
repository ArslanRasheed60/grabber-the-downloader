name: Build

# Run from the Actions tab or push to main, then download the installer artifacts.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current version as a GitHub release
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Confirm the app bundle is signed
        # An arm64 bundle with no signature at all is refused by the kernel, so this
        # is the difference between "warns on first open" and "will not start".
        run: codesign --verify --deep --strict --verbose=2 release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Grabber.app
      - uses: actions/upload-artifact@v7
        with:
          name: grabber-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download the verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'grabber-*' --dir release-assets
      - name: Verify and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.js --publish

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: grabber-windows-x64
          path: release/*.exe
          if-no-files-found: error
